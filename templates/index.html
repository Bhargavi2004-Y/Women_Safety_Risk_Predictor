<!DOCTYPE html>
<html>
<head>
    <title>Women Safety Predictor</title>
    <style>
        /* GENERAL STYLING */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to right, #ffecd2, #fcb69f);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* CONTAINER */
        .container {
            background: #fff;
            padding: 30px 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            width: 350px;
        }

        h2 {
            color: #ff6b6b;
            margin-bottom: 25px;
        }

        /* FORM STYLING */
        form select, form input {
            width: 100%;
            padding: 10px 12px;
            margin: 10px 0 20px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            background-color: #ff6b6b;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #ff4c4c;
        }

        /* RESULT STYLING */
        .result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Women Safety Risk Predictor</h2>
        <form action="/predict" method="post">

            <label>Location:</label>
            <select name="location">
                <option value="urban">Urban</option>
                <option value="rural">Rural</option>
            </select>

            <label>Time:</label>
            <select name="time">
                <option value="day">Day</option>
                <option value="night">Night</option>
            </select>

            <label>Crime Rate:</label>
            <input type="number" name="crime_rate" placeholder="Enter Crime Rate" required>

            <button type="submit">Predict Risk</button>
        </form>

        {% if prediction %}
            <div class="result">
                Risk Level: <span style="color: #ff6b6b;">{{ prediction }}</span>
            </div>
        {% endif %}
    </div>
</body>
</html>
